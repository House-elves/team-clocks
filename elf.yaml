# A House Elves elf: what Elf Desk needs to install, set up and run team-clocks. AGENTS.md says what each field means.
name: team-clocks
title: Team clocks
version: 0.3.0
author: "@phillip-kruger"
description: Shows the time and day of the week in each of your team mates' cities next to your own, with who is where, so you can pick a time that works for everyone.
main: TeamClocks.java
config: ~/.config/team-clocks/config
tools: []

# What it reads and writes, in plain words: the desk shows these before you install it, so they must be true and
# complete. Name every place outside this machine it reaches, and say when it waits for your click.
reads:
  - "Its own settings: the cities you list, your team mates and where they are, and your own city."
  - The time zone database already on this machine, with its list of each country's time zones.
writes:
  - Nothing outside this machine. The matched cities and the countries to pick from are saved for its tab on the desk.
  - Its own settings, when you add a city from its tab with +: the city goes on the end of Team cities.
  - Its own settings, when you add a team mate from its tab: they go on the end of Team mates.

settings:
  - key: CITIES
    label: Team cities
    help: "Comma-separated, like: London, Berlin, New York, Bangalore=Asia/Kolkata. Use a city's own name when it has a time zone, or Label=Area/City for any other place or for a team mate's name."
    kind: text
    default: London, New York, Tokyo
  - key: PEOPLE
    label: Team mates
    help: "Who is where, comma-separated, like: Anna=Berlin, Raj=Bangalore, Kim=Asia/Seoul. The place is one of your team cities, your own city, or any time zone (it gets a row of its own)."
    kind: text
    default: ""
    optional: true
  - key: HOME
    label: Your city
    help: Your own time, the base everything is compared to. Leave it empty to use this machine's time zone.
    kind: text
    default: ""
    optional: true
  - key: WORK_START
    label: Working day starts
    help: The hour (0–23) the working day starts in each city, for shading the rows.
    kind: int
    min: 0
    max: 23
    default: "9"
  - key: WORK_END
    label: Working day ends
    help: The hour (1–24) the working day ends in each city.
    kind: int
    min: 1
    max: 24
    default: "17"
  - key: HOUR_24
    label: 24-hour clock
    help: Show 14:05 instead of 2:05 PM.
    kind: bool
    default: "true"

commands:
  match:
    label: Match the cities
    args: [--save]
  dry-run:
    label: Match without saving
    args: []

dry-run: dry-run

# The tab's picker (country, then city, then +) adds the city to Team cities, and Add a team mate adds a name to Team
# mates. Both only change this elf's own settings.
actions:
  add-city:
    label: Add a city
    args: [--action=add-city]
    ask: false
    params:
      zone: {max: 60, pattern: "[A-Za-z][A-Za-z0-9_+\\-]*(/[A-Za-z0-9_+\\-]+){1,2}"}
      label: {max: 60, pattern: "[^,=\\p{Cntrl}]{0,60}", optional: true}
  add-person:
    label: Add a team mate
    args: [--action=add-person]
    ask: false
    params:
      name: {max: 40, pattern: "[^,=\\p{Cntrl}]{1,40}"}
      place: {max: 60, pattern: "[^,=\\p{Cntrl}]{1,60}"}

# Its tab (and dashboard card), drawn by ui/team-clocks.js in the desk's sandboxed frame. The clocks tick in the tab;
# the elf only runs to match the cities, once after setup and again when the tab sees the cities changed.
tab:
  page: ui/team-clocks.js
  card: true
refresh:
  command: match
data: [clocks]
